services:

  postgres:
    image: postgres:16-alpine
    container_name: dian_prep_postgres
    environment:
      POSTGRES_DB:       dian_prep
      POSTGRES_USER:     dian_user
      POSTGRES_PASSWORD: dian_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dian_user -d dian_prep"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dian_prep_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
