spring:
  application:
    name: dian-prep-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/dian_prep?stringtype=unspecified
    username: dian_user
    password: dian_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

# JWT Configuration
app:
  jwt:
    secret: dian-prep-secret-key-2024-change-in-production-must-be-256-bits-long
    expiration-ms: 86400000  # 24 horas

# IA Configuration (Groq - free tier)
  ai:
    provider: groq
    # Versión del perfil/prompt actual. Se graba en cada pregunta (version_generacion)
    # para poder distinguir material viejo de nuevo cuando se mejore el prompt.
    version-generacion: ${IA_VERSION_GENERACION:1}
    groq:
      api-key: ${GROQ_API_KEY:your-groq-api-key-here}
      base-url: https://api.groq.com/openai/v1
      # llama-3.3-70b-versatile fue descontinuado por Groq (ago-2026).
      # Modelo vigente open-weight con buena capacidad de razonamiento.
      model: ${GROQ_MODEL:openai/gpt-oss-120b}
      # Cada pregunta genera un objeto JSON grande (enunciado + 4 opciones +
      # 4 justificaciones + referencia). Con lotes de 5, 2500 tokens truncaban
      # la respuesta y el JSON llegaba incompleto (0 preguntas). 8000 da margen.
      max-tokens: ${GROQ_MAX_TOKENS:8000}
    gemini:
      api-key: ${GEMINI_API_KEY:your-gemini-api-key-here}
      # Modelo usado como VALIDADOR (dictamina lote por lote). gemini-2.5-flash dejó de
      # estar disponible para cuentas nuevas. Se usa un Flash-Lite vigente: liviano y con
      # alto cupo diario en free tier, suficiente para validar sin agotar la cuota.
      model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    # Doble IA: un segundo modelo (validador) revisa el lote en UNA sola llamada y
    # solo se persisten las preguntas aprobadas. Para que la revisión sea
    # independiente, el validador debe ser un proveedor/modelo distinto al redactor.
    validacion:
      enabled: ${IA_VALIDACION_ENABLED:true}
      # Proveedor del validador: "gemini" (recomendado, distinto del redactor Groq)
      # o "groq". Si el proveedor elegido no tiene API key, cae al que esté disponible.
      provider: ${IA_VALIDACION_PROVIDER:gemini}
      # Modelo del validador cuando el proveedor es groq (distinto al redactor).
      groq-model: ${IA_VALIDACION_GROQ_MODEL:llama-3.1-8b-instant}
      # Tope diario de llamadas al validador (free tier). Una llamada = un lote.
      limite-diario: ${IA_VALIDACION_LIMITE_DIARIO:400}
    # Job diario que mejora el banco en segundo plano: valida pendientes y regenera
    # huecos con el modelo premium, sin exceder los cupos gratuitos. Desactivado por
    # defecto; actívalo con IA_MANTENIMIENTO_ENABLED=true.
    mantenimiento:
      enabled: ${IA_MANTENIMIENTO_ENABLED:false}
      cron: ${IA_MANTENIMIENTO_CRON:0 0 3 * * *}
      modelo-premium: ${IA_MANTENIMIENTO_MODELO_PREMIUM:gemini-3.8-flash}
      limite-premium-diario: ${IA_MANTENIMIENTO_LIMITE_PREMIUM:20}
      objetivo-validadas-por-item: ${IA_MANTENIMIENTO_OBJETIVO:30}
      max-items-por-corrida: ${IA_MANTENIMIENTO_MAX_ITEMS:50}
    # Job de limpieza: elimina las preguntas RECHAZADA/AGOTADA (descartadas por el
    # validador) para que nunca lleguen a un simulacro. Activo por defecto.
    limpieza:
      enabled: ${IA_LIMPIEZA_ENABLED:true}
      cron: ${IA_LIMPIEZA_CRON:0 0 2 * * *}

# SpringDoc OpenAPI
# Se deja el path por defecto (/v3/api-docs) para que coincida con la ruta estándar
# que consumen Swagger UI y los clientes. SecurityConfig ya permite /v3/api-docs/**.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# El detalle de logging (appenders, patrón con traceId, rotación y niveles)
# vive en logback-spring.xml. Aquí solo se deja el nivel raíz como referencia.
logging:
  level:
    root: INFO
