spring:
  application:
    name: dian-prep-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/dian_prep?stringtype=unspecified
    username: dian_user
    password: dian_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

# JWT Configuration
app:
  jwt:
    secret: dian-prep-secret-key-2024-change-in-production-must-be-256-bits-long
    expiration-ms: 86400000  # 24 horas

# IA Configuration (Groq - free tier)
  ai:
    provider: groq
    groq:
      api-key: ${GROQ_API_KEY:your-groq-api-key-here}
      base-url: https://api.groq.com/openai/v1
      # llama-3.3-70b-versatile fue descontinuado por Groq (ago-2026).
      # Modelo vigente open-weight con buena capacidad de razonamiento.
      model: ${GROQ_MODEL:openai/gpt-oss-120b}
      max-tokens: 2500
    gemini:
      api-key: ${GEMINI_API_KEY:your-gemini-api-key-here}
      model: gemini-2.5-flash

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    com.dian.prep: DEBUG
    org.springframework.security: INFO
